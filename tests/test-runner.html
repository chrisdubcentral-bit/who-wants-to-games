<!doctype html>

<head>
  <meta charset="utf-8">

  <title>Tests · WWTWTEC</title>
  <link rel="stylesheet" href="../editions/celtic/theme.css">

  <style>
    body { padding: 24px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
