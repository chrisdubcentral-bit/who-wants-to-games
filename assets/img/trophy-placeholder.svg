<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="European Cup trophy">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8983"/>
      <stop offset="0.10" stop-color="#f4f7f5"/>
      <stop offset="0.26" stop-color="#aab3ad"/>
      <stop offset="0.46" stop-color="#ffffff"/>
      <stop offset="0.60" stop-color="#d3d9d5"/>
      <stop offset="0.78" stop-color="#7b857f"/>
      <stop offset="0.92" stop-color="#e6ebe8"/>
      <stop offset="1" stop-color="#858f89"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#aeb7b1"/>
      <stop offset="1" stop-color="#eef2f0"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6f2c"/>
      <stop offset="0.5" stop-color="#f1d999"/>
      <stop offset="1" stop-color="#9a7a35"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Big looping handles (drawn first so the body overlaps their joins) -->
  <g fill="none" stroke-linecap="round">
    <path d="M69 158 C52 130 36 92 37 58 C38 34 50 19 63 19 C74 19 80 28 77 37 C74 46 62 50 61 60 C60.5 64 62 68 66 72" stroke="#5f6964" stroke-width="6.5"/>
    <path d="M69 158 C52 130 36 92 37 58 C38 34 50 19 63 19 C74 19 80 28 77 37 C74 46 62 50 61 60 C60.5 64 62 68 66 72" stroke="url(#handle)" stroke-width="5"/>
    <path d="M67 153 C52 128 38.5 92 39.5 58 C40.5 37 51 22 63 21.5" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/>
    <path d="M131 158 C148 130 164 92 163 58 C162 34 150 19 137 19 C126 19 120 28 123 37 C126 46 138 50 139 60 C139.500 64 138 68 134 72" stroke="#5f6964" stroke-width="6.5"/>
    <path d="M131 158 C148 130 164 92 163 58 C162 34 150 19 137 19 C126 19 120 28 123 37 C126 46 138 50 139 60 C139.500 64 138 68 134 72" stroke="url(#handle)" stroke-width="5"/>
    <path d="M133 153 C148 128 161.500 92 160.500 58 C159.500 37 149 22 137 21.500" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.2"/>
  </g>

  <!-- Foot -->
  <path d="M86 192 C87 197 87 199 86 201 C80 211 68 216 65 222 L65 228 Q100 237 135 228 L135 222 C132 216 120 211 114 201 C113 199 113 197 114 192 Z" fill="url(#silver)"/>
  <path d="M86 192 C87 197 87 199 86 201 C80 211 68 216 65 222 L65 228 Q100 237 135 228 L135 222 C132 216 120 211 114 201 C113 199 113 197 114 192 Z" fill="url(#shade)"/>
  <path d="M65 222 Q100 231 135 222" fill="none" stroke="#5f6964" stroke-opacity="0.7" stroke-width="1"/>
  <path d="M72 214 Q100 221 128 214" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>

  <!-- Body: flared rim, narrow neck, broad shoulder, long taper -->
  <path d="M63 58 C63 66 67 68 66 73 C64 81 53 82 51.500 86 L51.500 90 C53 120 62 152 80 180 C82 184 82 187 82 189 L82 192 L118 192 L118 189 C118 187 118 184 120 180 C138 152 147 120 148.500 90 L148.500 86 C147 82 136 81 134 73 C133 68 137 66 137 58 Z" fill="url(#silver)"/>
  <path d="M63 58 C63 66 67 68 66 73 C64 81 53 82 51.500 86 L51.500 90 C53 120 62 152 80 180 C82 184 82 187 82 189 L82 192 L118 192 L118 189 C118 187 118 184 120 180 C138 152 147 120 148.500 90 L148.500 86 C147 82 136 81 134 73 C133 68 137 66 137 58 Z" fill="url(#shade)"/>

  <!-- Reflections -->
  <path d="M70 96 C72 124 79 150 91 172" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round"/>
  <path d="M84 98 C85 112 87 124 90 134" fill="none" stroke="#4f5954" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
  <path d="M127 98 C126 122 121 146 113 166" fill="none" stroke="#4f5954" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
  <path d="M74 66 Q100 78 126 66" fill="none" stroke="#5f6964" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Shoulder ridge and stem collar -->
  <path d="M51.500 86 Q100 96 148.500 86 L148.500 90 Q100 100 51.500 90 Z" fill="#ffffff" fill-opacity="0.7"/>
  <path d="M51.500 90 Q100 100 148.500 90" fill="none" stroke="#5f6964" stroke-opacity="0.7" stroke-width="1"/>
  <path d="M82 187 Q100 191 118 187" fill="none" stroke="#5f6964" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Rim with gilt inside -->
  <ellipse cx="100" cy="58" rx="37" ry="6" fill="url(#silver)" stroke="#5f6964" stroke-width="0.8"/>
  <ellipse cx="100" cy="58.500" rx="33" ry="4.300" fill="url(#inside)"/>
  <path d="M69 59.500 Q100 65 131 59.500" fill="none" stroke="#6d531d" stroke-opacity="0.6" stroke-width="1"/>
</svg>
