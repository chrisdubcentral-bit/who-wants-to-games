  <title>Who Wants To Win · Editions</title>
  <!-- Development launcher. Each edition is its own site in editions/<name>/. Add a line below for each new edition. -->
  <style>
    :root { color-scheme: dark; --bg: #0b0f0d; --card: #151b18; --line: #2a332e; --text: #e8ece9; --muted: #9aa59f; --accent: #e0c27a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; padding: 48px 16px; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 24px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
    strong { font-size: 1.05rem; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; }
    a { color: var(--bg); background: var(--accent); text-decoration: none; font-weight: 600; padding: 8px 14px; border-radius: 8px; }
    a.plain { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>

        </nav>
      </li>
    </ul>
    <p style="margin-top:24px"><a class="plain" href="tests/test-runner.html">Run tests</a></p>
  </main>
</body>
</html>
