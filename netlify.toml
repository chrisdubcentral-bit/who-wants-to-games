# Netlify builds the test site from this repo. Set the site's production branch to "live"
# (Site configuration → Build & deploy → Branches), so pushes to main don't reach testers.
[build]
  command = "node tools/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Online Top 100: netlify/functions/top100.mjs, with its tables in netlify/database/migrations.
[functions]
  node_bundler = "esbuild"
